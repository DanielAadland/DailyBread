name: Deploy

# Every push to main: update the database, then build and publish the website.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Public by design: these ship inside the website.
  EXPO_PUBLIC_SUPABASE_URL: https://kgdhzdtpidgtxsloqfvp.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_3pGEW9drmLWjn7XxlZA7LA__7loWUfo
  EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
  EXPO_PUBLIC_ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE_SIGN_IN }}
  CLOUDFLARE_PROJECT: dailybread

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - run: sudo apt-get install -y postgresql-client jq
      - name: Migrate and seed
        run: bash supabase/scripts/deploy-db.sh
      - name: Deploy the reminder function
        if: ${{ vars.VAPID_PUBLIC_KEY != '' }}
        run: npx --yes supabase@2 functions deploy send-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  website:
    needs: database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - name: Build the website
        run: pnpm --filter app build:web
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >&2
            exit 1
          fi
      - name: Create the Pages project (first deploy only)
        run: npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT" --production-branch main || true
      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy apps/app/dist --project-name "$CLOUDFLARE_PROJECT" --branch main --commit-dirty=true
