name: Deploy

# Every push to main: update the database, then build and publish the website.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Public by design: these ship inside the website.
  EXPO_PUBLIC_SUPABASE_URL: https://kgdhzdtpidgtxsloqfvp.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_3pGEW9drmLWjn7XxlZA7LA__7loWUfo
  EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
  EXPO_PUBLIC_ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE_SIGN_IN }}
  CLOUDFLARE_PROJECT: dailybread

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - run: sudo apt-get install -y postgresql-client jq
      - name: Migrate and seed
        run: bash supabase/scripts/deploy-db.sh
      - name: Deploy the reminder function
        if: ${{ vars.VAPID_PUBLIC_KEY != '' }}
        run: npx --yes supabase@2 functions deploy send-notifications --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  website:
    needs: database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - name: Build the website
        run: pnpm --filter app build:web
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >&2
            exit 1
          fi
          # Pasted secrets often carry a trailing newline; Wrangler rejects that.
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # An account ID is 32 hexadecimal characters. Describe a wrong value without printing it.
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            others=$(printf '%s' "$id" | tr -d 'a-zA-Z0-9' | fold -w1 | sort -u | tr -d '\n')
            echo "::error title=CLOUDFLARE_ACCOUNT_ID looks wrong::It should be 32 characters, 0-9 and a-f (Cloudflare dashboard → Account home → Account ID). The secret has ${#id} characters; other symbols in it: '${others}'."
            exit 1
          fi
          # An API token is a single word of letters, digits, '-' and '_' (about 40 characters).
          # Not the Global API Key, not the token's name, no "Bearer " in front.
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qi '^[[:space:]]*bearer'; then
            echo "::error title=CLOUDFLARE_API_TOKEN looks wrong::Remove the word 'Bearer' from the start of the secret; paste only the token itself."
            exit 1
          fi
          if ! printf '%s' "$token" | grep -Eq '^[A-Za-z0-9_-]{30,}$'; then
            others=$(printf '%s' "$token" | tr -d 'a-zA-Z0-9_-' | fold -w1 | sort -u | tr -d '\n')
            echo "::error title=CLOUDFLARE_API_TOKEN looks wrong::A Cloudflare API token is one word of letters, digits, '-' and '_' (usually 40 characters), shown once when you create it under My Profile → API Tokens → Create Token (template 'Edit Cloudflare Workers', or a custom token with Account → Cloudflare Pages → Edit). The secret has ${#token} characters; other symbols in it: '${others}'."
            exit 1
          fi
          # Values that have the right shape but are something else.
          if printf '%s' "$token" | grep -Eq '^[0-9a-f]{37}$'; then
            echo "::error title=CLOUDFLARE_API_TOKEN looks like the Global API Key::That key doesn't work here. Create an API token instead: My Profile → API Tokens → Create Token → 'Edit Cloudflare Workers'."
            exit 1
          fi
          if printf '%s' "$token" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error title=CLOUDFLARE_API_TOKEN looks like an ID::32 hexadecimal characters is the shape of a token ID or account ID, not the token itself. The token value is shown only once, right after you create it."
            exit 1
          fi
          # Ask Cloudflare whether the token is valid (user tokens and account tokens verify at different addresses).
          verify() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$1"; }
          user_status=$(verify https://api.cloudflare.com/client/v4/user/tokens/verify)
          account_status=$(verify "https://api.cloudflare.com/client/v4/accounts/$id/tokens/verify")
          if [ "$user_status" != "200" ] && [ "$account_status" != "200" ]; then
            echo "::error title=Cloudflare rejected CLOUDFLARE_API_TOKEN::Cloudflare answered ${user_status} (user token) / ${account_status} (account token). The token may have been deleted, expired, limited to other IP addresses, or copied incompletely. Create a new one (My Profile → API Tokens → Create Token → 'Edit Cloudflare Workers', account: yours) and paste the whole value into the secret."
            exit 1
          fi
          # The token must be allowed to use Pages in this account.
          pages_status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$id/pages/projects")
          if [ "$pages_status" != "200" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN can't use Cloudflare Pages::The token is valid, but listing Pages projects in this account answered ${pages_status}. Give it the permission Account → Cloudflare Pages → Edit, for the account whose ID is in CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      # Wrangler's own messages are turned into annotations, so failures are readable from the run summary.
      - name: Create the Pages project (first deploy only)
        env:
          NO_COLOR: '1'
        run: |
          set +e
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT" --production-branch main > create.log 2>&1
          if [ $? -ne 0 ] && ! grep -qi "already exists" create.log; then
            echo "::warning title=Pages project create::$(tail -n 15 create.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit 0
      - name: Publish to Cloudflare Pages
        env:
          NO_COLOR: '1'
        run: |
          set +e
          npx --yes wrangler@4 pages deploy apps/app/dist --project-name "$CLOUDFLARE_PROJECT" --branch main --commit-dirty=true 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Cloudflare Pages deploy failed::$(tail -n 25 deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"
