name: Deploy

# Every push to main: update the database, then build and publish the website.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Public by design: these ship inside the website.
  EXPO_PUBLIC_SUPABASE_URL: https://kgdhzdtpidgtxsloqfvp.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_3pGEW9drmLWjn7XxlZA7LA__7loWUfo
  EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
  EXPO_PUBLIC_ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE_SIGN_IN }}
  CLOUDFLARE_PROJECT: dailybread

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - run: sudo apt-get install -y postgresql-client jq
      - name: Migrate and seed
        run: bash supabase/scripts/deploy-db.sh
      - name: Deploy the reminder function
        if: ${{ vars.VAPID_PUBLIC_KEY != '' }}
        run: npx --yes supabase@2 functions deploy send-reminders --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

  website:
    needs: database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bible:import
      - name: Build the website
        run: pnpm --filter app build:web
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets." >&2
            exit 1
          fi
          # Pasted secrets often carry a trailing newline; Wrangler rejects that.
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # An account ID is 32 hexadecimal characters. Describe a wrong value without printing it.
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            others=$(printf '%s' "$id" | tr -d 'a-zA-Z0-9' | fold -w1 | sort -u | tr -d '\n')
            echo "::error title=CLOUDFLARE_ACCOUNT_ID looks wrong::It should be 32 characters, 0-9 and a-f (Cloudflare dashboard → Account home → Account ID). The secret has ${#id} characters; other symbols in it: '${others}'."
            exit 1
          fi
      # Wrangler's own messages are turned into annotations, so failures are readable from the run summary.
      - name: Create the Pages project (first deploy only)
        env:
          NO_COLOR: '1'
        run: |
          set +e
          npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT" --production-branch main > create.log 2>&1
          if [ $? -ne 0 ] && ! grep -qi "already exists" create.log; then
            echo "::warning title=Pages project create::$(tail -n 15 create.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit 0
      - name: Publish to Cloudflare Pages
        env:
          NO_COLOR: '1'
        run: |
          set +e
          npx --yes wrangler@4 pages deploy apps/app/dist --project-name "$CLOUDFLARE_PROJECT" --branch main --commit-dirty=true 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Cloudflare Pages deploy failed::$(tail -n 25 deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"
