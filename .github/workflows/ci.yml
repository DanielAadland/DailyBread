name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Bible text (needed by plan generation and search tests)
        run: pnpm bible:import
      - name: Check seed plans are up to date
        run: pnpm --filter @bible-app/db generate:plans && git diff --exit-code supabase/seed/plans.sql
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the website in demo mode
        run: pnpm --filter app build:web
      - name: End-to-end tests
        run: |
          pnpm --filter app exec playwright install --with-deps chromium
          pnpm --filter app test:e2e
